name: Frontend integration checks
on:
  push:
    branches:
      - feat/frontend-backend-integration
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/frontend-integration.yml'
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q backend tests scripts

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_test_only
          POSTGRES_DB: sentinel_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      BACKEND_TEST_DATABASE_URL: postgresql+psycopg://sentinel:sentinel_test_only@127.0.0.1:5432/sentinel_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-backend.txt
      - run: python scripts/acquire_reports.py
      - run: python scripts/rebuild_dataset.py > /tmp/sentinel-dataset.log
      - run: python -m unittest tests.test_backend -v
