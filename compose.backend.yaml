services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${SENTINEL_DB_PASSWORD:?Set SENTINEL_DB_PASSWORD locally}
      POSTGRES_DB: sentinel
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sentinel_backend_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  sentinel_backend_pg:
