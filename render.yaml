# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Public: one service serves the read-only API and the dashboard, without a token.
services:
  - type: web
    name: sentinel-api
    runtime: docker
    plan: free
    region: singapore
    branch: feat/frontend-backend-integration
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: SENTINEL_DB_SSLMODE
        value: require
      - key: SENTINEL_PUBLIC_ACCESS
        value: "true"
      - key: SENTINEL_FRONTEND_DIR
        value: /app/frontend/dist
# Uses the existing sentinel-db in the approved workspace.
